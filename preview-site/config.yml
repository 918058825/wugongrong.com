# If your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would
# contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
baseURL: "https://wugongrong.com/"
title: 阿荣说
copyright: ""
theme: [PaperMod]
themesDir: ..

module:
  mounts:
    - source: content
      target: content
    - source: ../归档
      target: content/posts

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 3

defaultContentLanguage: zh
defaultContentLanguageInSubdir: false

languages:
  zh:
    languageName: "简体中文"
    languageCode: "zh-CN"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: 系列
    menu:
      main:
        - name: 关于
          url: about
          weight: 1
        - name: 随笔
          url: weekly/
          weight: 2
        - name: 分栏
          url: categories/
          weight: 3
        - name: 归档
          url: archive/
          weight: 4
        - name: 作品
          url: works/
          weight: 5

outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - llms

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "吴功荣的个人博客，记录思考、学习、写作与日常生活。"
  author: 吴功荣
  # author: ["Me", "You"] # multiple authors

  defaultTheme: dark
  disableThemeToggle: false
  ShowShareButtons: false
  ShowReadingTime: false
  hideAuthor: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  images: ["images/papermod-cover.png"]

  profileMode:
    enabled: false
    title: PaperMod
    imageUrl: "#"
    imageTitle: my image
    # imageWidth: 120
    # imageHeight: 120
    buttons:
      - name: 文章归档
        url: archives
      - name: 标签
        url: tags

  homeInfoParams:
    Title: "个人博客"
    Subtitle: "欢迎来访"
    Role: "生活记录 · 阅读与写作"
    Content: "记录日常生活、阅读思考和一些折腾经历。"
    Topics: ["生活", "阅读", "写作", "思考", "观察"]
    IntroLines:
      - "你好，欢迎来到我的博客。这里主要记录生活、阅读与思考。"
      - "我喜欢观察日常、整理想法，也会分享折腾工具和写作的过程。"
      - "这个博客用来记录一些经历、经验和不一样的日常。"
      - "网站基于 Hugo 构建，并使用 PaperMod 主题进行定制。"
      - "可以从归档浏览文章，或通过标签查找感兴趣的内容。"

  editPost:
    URL: "https://github.com/adityatelange/hugo-PaperMod/tree/exampleSite/content"
    Text: "建议修改" # edit text
    appendFilePath: true # to append file path to Edit link

  # label:
