<header class="header">
  <nav class="header-nav" aria-label="主导航">
    <div class="logo">
      <a href="{{ "" | absLangURL }}" accesskey="h" title="返回首页">
        <img class="site-logo" src="{{ "images/logo-arong.svg" | absURL }}" alt="" width="34" height="34">
        <span>{{ site.Title }}</span>
      </a>
    </div>

    <ul class="menu">
      {{- $pageURL := .RelPermalink | strings.TrimSuffix "/" -}}
      {{- range site.Menus.main }}
      {{- $menuURL := .URL | relLangURL | strings.TrimSuffix "/" -}}
      <li>
        <a href="{{ .URL | absLangURL }}" {{ if eq $menuURL $pageURL }}class="active" aria-current="page"{{ end }}>
          <span>{{ .Name }}</span>
        </a>
      </li>
      {{- end }}
    </ul>

    <div class="header-actions">
      <a class="header-icon" href="{{ "search/" | absLangURL }}" aria-label="搜索" title="搜索">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      </a>
      {{- if not site.Params.disableThemeToggle }}
      <button id="theme-toggle" class="header-icon theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"></path></svg>
      </button>
      {{- end }}
      <a class="header-icon github-link" href="https://github.com/repos?q=owner%3A%40me" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
        <svg class="github-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297C5.37.297 0 5.667 0 12.297c0 5.3 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.73.083-.73 1.205.084 1.84 1.237 1.84 1.237 1.07 1.835 2.807 1.305 3.492.997.108-.775.418-1.305.762-1.605-2.665-.3-5.467-1.332-5.467-5.93 0-1.31.468-2.38 1.235-3.22-.124-.303-.535-1.523.117-3.176 0 0 1.008-.322 3.3 1.23a11.5 11.5 0 0 1 6.003 0c2.29-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.873.118 3.176.77.84 1.233 1.91 1.233 3.22 0 4.61-2.807 5.625-5.48 5.92.43.372.823 1.102.823 2.222 0 1.605-.015 2.9-.015 3.293 0 .322.216.694.825.576A12.01 12.01 0 0 0 24 12.297C24 5.667 18.627.297 12 .297z"/></svg>
      </a>
    </div>
  </nav>
</header>
